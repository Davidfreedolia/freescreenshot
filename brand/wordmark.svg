<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" role="img" aria-label="freescreenshot">
  <title>freescreenshot wordmark</title>
  <!-- Mark: viewfinder bracket pair -->
  <g stroke="#A3E635" stroke-width="3.5" stroke-linecap="square" fill="none">
    <!-- top-left corner bracket -->
    <path d="M 16 28 L 16 16 L 28 16" />
    <!-- bottom-right corner bracket -->
    <path d="M 64 68 L 64 80 L 52 80" />
  </g>
  <!-- subtle inner mark (a single dot suggesting the captured pixel) -->
  <circle cx="40" cy="48" r="3" fill="#A3E635" />

  <!-- Wordmark text -->
  <text x="100" y="62"
        font-family="Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif"
        font-size="38"
        font-weight="600"
        letter-spacing="-0.5"
        fill="#F5F2EC">freescreenshot</text>
</svg>
